name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@7df8c67cf681d8fc7ee0831d74c1e9d8640b12a9 # v1.3.4
    with:
      install-for-publish: false
    secrets: inherit
