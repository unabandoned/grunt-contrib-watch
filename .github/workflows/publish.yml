name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@23139a663b090be91f54115baa805f4588255aa5 # v1.3.8
    with:
      install-for-publish: false
    secrets: inherit
